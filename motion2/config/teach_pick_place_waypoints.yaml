# OMY-F3M Teach-and-Replay Pick/Place Waypoint 설정 파일
#
# 이 파일은 record_teach_waypoint.py 로 기록한 관절 값들을 저장한다.
# run_teach_pick_place.py 가 이 파일을 읽어 순서대로 관절 명령을 전송한다.
#
# 사용 방법:
#   기록: python3 motion2/scripts/record_teach_waypoint.py --name <이름> --overwrite
#   재생: python3 motion2/scripts/run_teach_pick_place.py  (dry-run 기본)
#         python3 motion2/scripts/run_teach_pick_place.py --execute --confirm EXECUTE_TEACH_PICK_PLACE

# verified: true 로 바꾸기 전까지는 실험적 파일로 간주
verified: false
# 로봇 런치 파일 (참고용, 실제 실행은 별도 터미널에서 미리 실행해야 함)
bringup: omy_f3m.launch.py
# 동작 모드: MoveIt 이나 Cartesian 이 아닌 직접 관절 제어(joint-space replay)
mode: teach_waypoint_replay

# ─── ROS2 Action 서버 이름 ─────────────────────────────────────────────────
controller:
  # 암 6축 제어: control_msgs/action/FollowJointTrajectory
  arm_action: /arm_controller/follow_joint_trajectory
  # 그리퍼 제어: control_msgs/action/GripperCommand
  gripper_action: /gripper_controller/gripper_cmd

# ─── Safety 파라미터 ──────────────────────────────────────────────────────
safety:
  # 연속된 waypoint 사이에서 어느 한 관절의 최대 허용 변위 [rad]
  # 이 값을 초과하면 실행 전 _build_steps에서 ValueError를 발생시킨다
  max_joint_delta_per_step: 0.35
  # 그리퍼 위치 가드: [min, max] 범위 밖의 목표값은 거부됨
  # OMY-F3M 물리적 한계: 완전 열림=0.0, 완전 닫힘≈1.12
  min_gripper_position: 0.0
  max_gripper_position: 1.12
  # 각 암 waypoint 이동에 허용하는 기본 시간 [s] (최소 4.0 강제)
  default_arm_duration: 5.0
  # 그리퍼 최대 토크 [N·m]: 0.0 = 컨트롤러 기본값 사용
  default_gripper_max_effort: 0.0
  # true이면 --execute 와 함께 --confirm EXECUTE_TEACH_PICK_PLACE 를 동시에 입력해야 함
  execute_requires_confirm: true
  # 이 파일의 waypoint로는 MoveIt pose goal 이나 Cartesian 실행을 허용하지 않음
  # (MoveIt은 joint wraparound trajectory를 생성할 수 있어 위험함)
  forbidden_execution:
  - MoveIt pose execute
  - Cartesian execute

# ─── 관절 정의 ────────────────────────────────────────────────────────────
# OMY-F3M 6축 암 관절 이름 (run_teach_pick_place.py의 ARM_JOINTS 와 반드시 일치)
arm_joints:
- joint1
- joint2
- joint3
- joint4
- joint5
- joint6
# 그리퍼 관절 이름
gripper_joint: rh_r1_joint

# ─── 그리퍼 목표 위치 ─────────────────────────────────────────────────────
gripper_targets:
  close_gripper: 0.6   # 파지 시 그리퍼 목표 위치 [m] (~53% 닫힘, 물체 크기에 따라 조정)
  open_gripper: 0.0    # 해제 시 그리퍼 목표 위치 [m] (완전 열림)

# ─── 실행 시퀀스 ──────────────────────────────────────────────────────────
# close_gripper / open_gripper 는 특수 키워드: waypoints 딕셔너리가 아닌
# gripper_targets 값을 사용하는 GripperStep 으로 변환된다
sequence:
- pre_grasp      # 파지 준비: 물체 위 접근 자세
- grasp          # 파지 자세: 그리퍼를 물체에 밀착
- close_gripper  # [그리퍼] 닫기 → 물체 파지
- lift           # 들어올리기: 물체를 안전 높이로 이동
- place          # 내려놓기: 목표 위치로 이동 후 하강
- open_gripper   # [그리퍼] 열기 → 물체 해제
- retract        # 복귀: 물체와 충돌 없이 후퇴하는 안전 자세

# ─── Waypoint 목록 ────────────────────────────────────────────────────────
# 각 waypoint 구조:
#   arm:           joint1~6 목표 각도 [rad]
#   gripper:       rh_r1_joint 목표 위치 [m]
#   recorded_at_utc: 기록 시각 (UTC ISO 8601, 감사 로그 용도)
#   ee_pose:       기록 당시 end-effector 자세 (참고용, 실행에 영향 없음)
#     frame_id:    기준 프레임 (link0 = 로봇 베이스)
#     link_name:   EE 프레임 (link6 = 6번째 링크/손목)
#     position:    EE 위치 [m] (x, y, z)
#     quat_wxyz:   EE 자세 쿼터니언 (w, x, y, z)
waypoints:
  # ── start: 홈 자세 (팔꿈치를 위로 접은 수직 대기 자세) ──────────────────
  # joint2≈-π/2, joint3≈2.65: 팔이 위를 향해 접혀 있는 상태
  # EE 위치: x≈-0.05, z≈0.39 (베이스 위 낮은 높이)
  start:
    arm:
      joint1: -2.3968449810713143e-05
      joint2: -1.5706525160960323
      joint3: 2.6531156464474592
      joint4: -1.0819118560057805
      joint5: 1.5706884687707483
      joint6: 0.0
